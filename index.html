<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLACKBOX // NODE-8</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grid"></div>
<main>
  <div class="status">● NODE-8 ONLINE</div>
  <h1>BLACKBOX</h1>
  <h2>// NODE-8</h2>
  <p class="subtitle">SECURE RESEARCH TERMINAL</p>

  <section class="terminal">
    <div class="terminal-top">BLACKBOX ACCESS TERMINAL <span>NODE: 08</span></div>
    <form id="loginForm">
      <label for="username">IDENTITY</label>
      <input id="username" autocomplete="off" placeholder="enter username">
      <label for="password">ACCESS KEY</label>
      <input id="password" type="password" placeholder="enter access key">
      <button type="submit">AUTHENTICATE</button>
    </form>
    <div id="output">SYSTEM READY.<br>Awaiting authentication...</div>
  </section>

  <p class="warning">⚠ FICTIONAL TRAINING ENVIRONMENT — NO REAL DATA</p>
</main>
<script src="app.js"></script>
</body>
</html>
